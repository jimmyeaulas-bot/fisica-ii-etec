    <script>
    // ============================================
    // (Código encurtado para foco nas correções KaTeX)
    // Para trechos completos/estáticos, manter conteúdo do arquivo anterior
    // ============================================

    // --- Função correta para renderização das fórmulas nas opções ---
    function renderExercise() {
        const ex = appState.currentExercise;
        // ... outros campos da questão ...
        // Math rendering with KaTeX
        const mathContainer = document.getElementById('questionMath');
        if (ex.math) {
            try {
                katex.render(ex.math, mathContainer, {
                    throwOnError: false,
                    displayMode: true
                });
            } catch (e) {
                console.error("Erro ao renderizar fórmula LaTeX em mathContainer:", e, ex.math);
                mathContainer.textContent = ex.math;
            }
        } else {
            mathContainer.innerHTML = '';
        }

        // --- Renderização das fórmulas KaTeX nas opções de fórmula ---
        const formulaContainer = document.getElementById('formulaOptions');
        formulaContainer.innerHTML = '';
        ex.formulas.forEach((formula, index) => {
            // Corrigir barra dupla em todas as fórmulas do banco de exercícios!
            let safeFormula = formula.replace(/([^\\])\\([a-zA-Z])/g, '$1\\\\$2'); // robustez extra
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.onclick = () => selectFormula(index, btn);
            formulaContainer.appendChild(btn);
            try {
                katex.render(safeFormula, btn, {
                    throwOnError: false,
                    displayMode: false
                });
            } catch (e) {
                console.error("Erro ao renderizar fórmula em opção:", e, safeFormula);
                btn.textContent = formula;
            }
        });
        // ... resto da função renderExercise ...
    }
    // ===== Garante também que as fórmulas do banco estejam corretas =====
    // Exemplo:
    // formulas: ['$E = h \\cdot f$', '$E = m \\cdot c^2$', '$P = \\frac{E}{t}$']
    //
    // Se necessário, revisar manualmente todas as instâncias acima fora das funções.
    //
    // --- Correção em updateTheory ---
    function updateTheory(topic) {
        const theory = theoryInfo[topic];
        if (theory) {
            document.getElementById('theoryTopic').textContent = theory.title;
            document.getElementById('theoryDescription').textContent = theory.description;
            const formulaContainer = document.getElementById('theoryFormula');
            formulaContainer.innerHTML = '';
            try {
                katex.render(theory.formula, formulaContainer, {
                    throwOnError: false,
                    displayMode: true
                });
            } catch (e) {
                console.error("Erro ao renderizar teoria:", e, theory.formula);
                formulaContainer.textContent = theory.formula;
            }
        }
    }
    //
    // Removendo qualquer renderMathInElement e auto-render para evitar ambiguidades
    // ... restante do código permanece igual ...
    </script>
